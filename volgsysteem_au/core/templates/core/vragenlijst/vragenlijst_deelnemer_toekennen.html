{% extends "core/base.html" %}

{% block main_title %}
    <title>Vragenlijst</title>
{% endblock %}

{% block body_block %}
    <h1>Vragenlijst toekennen</h1>
    <p>Opgegeven naam:<strong>{{ opgegeven_naam }}</strong></p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="action-bar">
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{% url 'core:resultaten_vragenlijst_ingevuld' %}" class="btn btn-secondary">Annuleren</a>
        </div>
    </form>
{% endblock %}

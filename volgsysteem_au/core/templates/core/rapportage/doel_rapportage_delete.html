{% extends "core/base.html" %}

{% block main_title %}
    <title>Rapportage verwijderen</title>
{% endblock %}

{% block body_block %}
    <h2>Weet je zeker dat je '{{ object }}' wilt verwijderen?</h2>
    <form method="post">
        {% csrf_token %}
        <input type="submit" class="btn btn-danger" value="Verwijderen">
        <a href="{% url 'core:deelnemer_doelen_list' deelnemer_id %}" class="btn btn-secondary">Annuleren</a>
    </form>
{% endblock %}

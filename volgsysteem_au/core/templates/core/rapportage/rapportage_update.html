{% extends "core/base.html" %}

{% block main_title %}
    <title>Update rapportage</title>
{% endblock %}

{% block body_block %}
    <h1>Bewerk rapportage {{rapportage}}</h1>
    <form method="post" action="{% url 'core:rapportage_update' rapportage.id %}">
        {% csrf_token %}
        {{ form.as_p}}
        <button type="submit">Opslaan</button>
    </form>
    <h5><a href="{% url 'core:rapportage_delete' rapportage.id %}" >Rapportage verwijderen</a></h5>
{% endblock %}

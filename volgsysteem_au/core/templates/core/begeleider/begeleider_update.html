{% extends "core/base.html" %}

{% block main_title %}
    <title>{{ begeleider.naam }}</title>
{% endblock %}

{% block body_block %}

    <h1>{{ begeleider.naam }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="action-bar">
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{% url 'core:begeleider_list' %}" class="btn btn-secondary">Annuleren</a>
        </div>
    </form>

{% endblock %}

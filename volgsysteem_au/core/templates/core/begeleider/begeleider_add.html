{% extends "core/base.html" %}

{% block main_title %}
    <title>Begeleider</title>
{% endblock %}

{% block body_block %}
    <form method="post" action="{% url 'core:begeleider_add' %}">
        {% csrf_token %}
        {{ form.as_p}}
        <div class="action-bar">
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{% url 'core:begeleider_list' %}" class="btn btn-secondary">Annuleren</a>
        </div>
    </form>
{% endblock %}

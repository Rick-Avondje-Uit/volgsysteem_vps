{% extends "core/base.html" %}

{% block main_title %}
    <title>Ticket</title>
{% endblock %}

{% block body_block %}
    <h1>Bewerk ticket {{ticket}}</h1>
    <form method="post" action="{% url 'core:ticket_update_individual' ticket.id %}">
        {% csrf_token %}
        {{ form.as_p}}
        <div class="action-bar">
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{% url 'core:activiteit_detail' ticket.activiteit.id %}" class="btn btn-secondary">Annuleren</a>
        </div>
    </form>
{% endblock %}

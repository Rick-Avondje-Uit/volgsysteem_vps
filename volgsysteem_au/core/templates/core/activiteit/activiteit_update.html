{% extends "core/base.html" %}

{% block main_title %}
    <title>Activiteit</title>
{% endblock %}


{% block body_block %}
    <h1>{{activiteit.naam}}</h1>
    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="action-bar">
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{% url 'core:activiteit_detail' activiteit.id %}" class="btn btn-secondary">Annuleren</a>
        </div>
    </form>
{% endblock %}

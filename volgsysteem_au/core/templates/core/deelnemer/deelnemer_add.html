{% extends "core/base.html" %}

{% block main_title %}
    <title>Deelnemer</title>
{% endblock %}

{% block body_block %}
    <h1>Deelnemer toevoegen</h1>
    <form method="post" action="{% url 'core:deelnemer_add' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="action-bar">
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{% url 'core:deelnemer_list' %}" class="btn btn-secondary">Annuleren</a>
        </div>
    </form>
{% endblock %}
